<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Welcher Tag ist heute?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f2f2f2;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      font-size: 28px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Heute ist:</h1>
  <h2 id="tag"></h2>
</div>

<script>
  const tage = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const heute = new Date().getDay();
  document.getElementById("tag").innerText = tage[heute];
</script>

</body>
</html>
